[platformio]
default_envs = waveshare-esp32-p4-10-1

[env:waveshare-esp32-p4-10-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
platform_packages =
    tool-esptoolpy @ https://github.com/pioarduino/esptool/releases/download/v5.4.0/esptool.zip
board = esp32-p4_r3
framework = arduino
monitor_speed = 115200
; Keep the CH343 adapter at its reliable initial rate; higher-rate switching can
; produce "Invalid head of packet" errors on some Windows driver/cable setups.
upload_speed = 115200

; SKU 33150 has 32 MB flash and an ESP32-P4 revision 3.x.
board_upload.flash_size = 32MB
board_upload.maximum_size = 33423360
board_build.flash_mode = qio
board_build.partitions = partitions.csv
extra_scripts =
    pre:tools/platformio_pre.py
    post:tools/platformio_post.py

build_flags =
    -D LCD_X_DISPLAY_VARIANT=101
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3
    -Wno-missing-field-initializers

board_build.embed_files =
    data/ui/base.rgb565
    data/ui/skull.rgb565
    data/ui/hint.rgb565
    data/audio/finger.pcm
    data/audio/granted.pcm
    data/audio/denied.pcm
    data/audio/riser.pcm
